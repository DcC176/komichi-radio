# 二十四时小路电台 · nginx 反向代理配置
#
# 适用场景：绑定了自己的域名，想让站点走 HTTPS。
# 不绑域名（直接用 http://IP:8080 访问）时不需要这个文件。
#
# 安装：
#   sudo cp deploy/nginx-komichi.conf /etc/nginx/conf.d/komichi-radio.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 把下面所有 radio.example.com 换成你的真实域名。

# ---------- HTTP：只做跳转 + 证书签发目录 ----------
server {
    listen 80;
    listen [::]:80;
    server_name radio.example.com;

    # 用 certbot --webroot 签证书时需要这个目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：实际服务 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name radio.example.com;

    # 证书：腾讯云/阿里云控制台可申请免费证书，或用 certbot 自动签发
    ssl_certificate     /etc/letsencrypt/live/radio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # ---------------- 访问控制（可选，二选一或都关） ----------------
    # 这是公开地址上的一个「B 站取流转发器」，建议至少启用其中一种，
    # 否则任何人拿到链接都能借你的服务器出口带宽看视频。
    #
    # 方式 A：密码保护（需要 `sudo apt install apache2-utils` 后
    #         `sudo htpasswd -c /etc/nginx/.htpasswd 你的用户名`）
    # auth_basic           "二十四时小路电台";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    #
    # 方式 B：IP 白名单
    # allow 203.0.113.10;
    # allow 198.51.100.0/24;
    # deny  all;

    # ---------------- 反代 ----------------
    location / {
        proxy_pass http://127.0.0.1:8080;

        # app.py 的 public_base() 优先读 X-Forwarded-Host 来生成 MPD 里的
        # <BaseURL>。**这一行不能省**，否则线上会生成错误的地址、播放失败。
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        proxy_http_version 1.1;

        # 视频流必须关缓冲，否则 nginx 会先把整个分片读进内存/临时文件再转发，
        # 拖进度（Range 请求）会明显卡顿甚至超时。
        proxy_buffering off;
        proxy_request_buffering off;

        # 媒体分片可能较大，且上游 B 站 CDN 偶有慢响应
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 15s;

        # 不限制单次响应体大小（视频分片可达数十 MB）
        proxy_max_temp_file_size 0;

        # Range 头默认会透传，这里显式声明避免以后被人误删
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        client_max_body_size 0;
    }

    # 静态前端可以稍微缓存，但不要缓存 /api/（节目单需要实时）
    location ~* ^/(assets|data)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }
}
